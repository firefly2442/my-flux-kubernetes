apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: convertx
  namespace: convertx
spec:
  interval: 5m
  chart:
    spec:
      chart: convertx
      version: 1.0.0
      sourceRef:
        kind: HelmRepository
        name: convertx
        namespace: flux-system
      interval: 5m
  # https://github.com/trueforge-org/truecharts/blob/master/charts/stable/convertx/values.yaml
  values:
    image:
      repository: harbor.homelab.rivetcode.com/ghcr-proxy/c4illin/convertx
    persistence:
      data:
        enabled: true
        storageClass: "longhorn-ha-2"
        size: 1Gi
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                # since we are using Let's Encrypt, we can set this to true
                HTTP_ALLOWED: "true"
                # this is our local network so we don't need to setup accounts
                ALLOW_UNAUTHENTICATED: "true"
