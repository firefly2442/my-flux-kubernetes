apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
  namespace: opencode
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "autoupdate": false,
      "share": "disabled",
      "permission": {
        "edit": "allow",
        "bash": "ask",
        "webfetch": "deny"
      },
      "provider": {
        "strix": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "strix",
          "options": {
            "baseURL": "https://qwen3-8-27b-uncensored.homelab.rivetcode.com/v1"
          },
          "models": {
            "qwen3.8-27b-uncensored": { "name": "qwen3.8-27b-uncensored" }
          }
        }
      },
      "model": "strix/qwen3.8-27b-uncensored"
    }
