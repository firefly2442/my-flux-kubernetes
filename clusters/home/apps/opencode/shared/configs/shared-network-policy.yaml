apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shared-opencode-lockdown
  namespace: opencode
spec:
  podSelector: {} # all pods in this namespace
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: gatus
        podSelector:
          matchLabels:
            app.kubernetes.io/name: gatus
      ports:
        - port: 4096 # opencode web-ui
        - port: 8443 # vscode
        - port: 8060 # godot web editor
  egress: # very limited, some internet through proxy, only access to local models
    # DNS, only to cluster CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The model service in llmkube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llmkube-system
      ports:
        - port: 8080
          protocol: TCP
    # The model service in ollama
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ollama
      ports:
        - port: 11434
          protocol: TCP
    # Allow egress traffic to the internal proxy pod
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: squid-proxy
      ports:
        - port: 3128
          protocol: TCP
    # Allow egress traffic to the internal gogs git repositories
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gogs
      ports:
        - port: 3000
          protocol: TCP
