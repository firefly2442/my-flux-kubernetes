apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: godot-ingressroute
  namespace: opencode
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-clusterissuer
    gethomepage.dev/href: "https://godot.homelab.rivetcode.com"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Godot
    gethomepage.dev/group: Programming
    gethomepage.dev/icon: mdi-application
    gethomepage.dev/app: godot # optional, may be needed if app.kubernetes.io/name != ingress metadata.name
    gethomepage.dev/name: Godot
    #gethomepage.dev/widget.type: "godot"
    #gethomepage.dev/widget.url: "https://godot.homelab.rivetcode.com"
    gethomepage.dev/pod-selector: ""
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`godot.homelab.rivetcode.com`)
    kind: Rule
    services:
    - name: godot-docker-vscode-customized
      port: 8060
    middlewares:
      - name: authentik-service-middleware
        namespace: authentik
  tls:
    secretName: godot-certificate-secret
