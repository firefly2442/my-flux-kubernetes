apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: godot
  namespace: opencode
spec:
  interval: 5m
  chart:
    spec:
      chart: ./chart
      sourceRef:
        kind: GitRepository
        name: godot
        namespace: flux-system
  # https://github.com/firefly2442/docker-vscode-customized/blob/master/chart/values.yaml
  values:
    command:
      - sh
      - -c
      - cd /godot-web && python3 godot-serve.py
    image:
      repository: harbor.homelab.rivetcode.com/ghcr-proxy/firefly2442/docker-vscode-customized
    env:
      - name: OPENCODE_CONFIG
        value: /etc/opencode/opencode.json
      - name: HTTPS_PROXY
        value: "http://squid-proxy-service.squid-proxy.svc.cluster.local:3128"
      - name: HTTP_PROXY
        value: "http://squid-proxy-service.squid-proxy.svc.cluster.local:3128"
      - name: NO_PROXY
        value: "localhost,127.0.0.1,.cluster.local"
    volumeMounts:
      - name: shared-opencode-config
        mountPath: /etc/opencode
        readOnly: true
    volumes:
      - name: shared-opencode-config
        configMap:
          name: shared-opencode-config
    podSecurityContext:
      runAsNonRoot: false
      runAsUser: 0
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
        add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]
      readOnlyRootFilesystem: false
    livenessProbe:
      httpGet:
        path: /
        port: 8060
    readinessProbe:
      httpGet:
        path: /
        port: 8060
    service:
      type: ClusterIP
      port: 8060
    persistence:
      enabled: true
      accessModes:
        - ReadWriteMany
      existingClaim: opencode-projects-pvc
      mountPath: /home/web_user/projects
