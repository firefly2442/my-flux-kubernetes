apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-device-plugin
  namespace: kube-system
spec:
  interval: 10m
  chart:
    spec:
      # https://github.com/squat/generic-device-plugin
      chart: generic-device-plugin
      # https://charts.gabe565.com/charts/generic-device-plugin/
      # 3rd party repo that provides a Helm chart to install the generic-device-plugin
      version: '0.1.3'
      sourceRef:
        kind: HelmRepository
        name: gabe565
        namespace: flux-system
  values:
    env:
      DOMAIN: devic.es
    tolerations:
      - key: node-role.kubernetes.io/worker
        operator: Equal
        value: ephemeral
        effect: NoSchedule
    config:
      enabled: true
      data: |
        devices:
          - name: dri-render
            groups:
              - paths:
                  - path: /dev/dri/renderD128
                  - path: /dev/kfd
