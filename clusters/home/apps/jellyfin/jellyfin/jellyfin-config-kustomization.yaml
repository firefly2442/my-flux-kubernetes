apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin-config
  namespace: jellyfin
spec:
  interval: 10m
  path: ./clusters/home/apps/jellyfin/jellyfin/configs/
  prune: true
  dependsOn:
    - name: jellyfin
      namespace: jellyfin
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
