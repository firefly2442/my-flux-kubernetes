apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 5m
  chart:
    spec:
      chart: jellyfin
      # https://truecharts.org/charts/stable/jellyfin/
      version: '24.1.2'
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: flux-system
      interval: 5m
  # https://github.com/trueforge-org/truecharts/blob/master/charts/stable/jellyfin/values.yaml
  values:
    persistence:
      config:
        enabled: true
        mountPath: "/config"
        storageClass: 'longhorn-ha-2'
        size: 10Gi
      data:
        enabled: true
        mountPath: "/data"
        storageClass: 'longhorn-ha-2'
        size: 10Gi
      media:
        enabled: true
        mountPath: "/jellyfin-media"
        existingClaim: 'jellyfin-media'
      logs:
        enabled: true
        mountPath: "/logs"
        type: "emptyDir"
      cache:
        enabled: true
        mountPath: "/cache"
        type: "emptyDir"
      transcode:
        enabled: true
        mountPath: "/cache/transcodes"
        type: "emptyDir"
