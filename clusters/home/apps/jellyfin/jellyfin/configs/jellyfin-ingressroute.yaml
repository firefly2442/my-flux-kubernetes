apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-ingressroute
  namespace: jellyfin
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-clusterissuer
    gethomepage.dev/href: "https://jellyfin.homelab.rivetcode.com"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Jellyfin
    gethomepage.dev/group: Smart Home
    gethomepage.dev/icon: mdi-application
    gethomepage.dev/app: jellyfin # optional, may be needed if app.kubernetes.io/name != ingress metadata.name
    gethomepage.dev/name: Jellyfin
    gethomepage.dev/widget.type: "jellyfin"
    # use .local domain name so we don't get blocked by authentik
    gethomepage.dev/widget.url: "http://jellyfin.jellyfin.svc.cluster.local:8096"
    gethomepage.dev/pod-selector: ""
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`jellyfin.homelab.rivetcode.com`)
    kind: Rule
    services:
    - name: jellyfin
      port: 8096
    middlewares:
      - name: authentik-service-middleware
        namespace: authentik
  tls:
    secretName: jellyfin-certificate-secret
