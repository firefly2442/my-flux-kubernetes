apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 5m
  prune: true
  wait: true
  path: ./clusters/home/apps/jellyfin/jellyfin/release/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
