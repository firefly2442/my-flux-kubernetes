apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: satisfactory
  namespace: satisfactory
spec:
  interval: 5m
  chart:
    spec:
      chart: satisfactory
      version: 14.10.1
      sourceRef:
        kind: HelmRepository
        name: satisfactory
        namespace: flux-system
      interval: 5m
  # https://github.com/trueforge-org/truecharts/blob/master/charts/stable/satisfactory/values.yaml
  values:
    image:
      repository: harbor.homelab.rivetcode.com/dockerhub-proxy/wolveix/satisfactory-server
    persistence:
      config:
        enabled: true
        mountPath: /config
        size: 2Gi
        storageClass: "longhorn-ha-2"
