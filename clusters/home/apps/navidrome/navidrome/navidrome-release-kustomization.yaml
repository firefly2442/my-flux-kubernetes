apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: navidrome
  namespace: navidrome
spec:
  interval: 5m
  prune: true
  wait: true
  path: ./clusters/home/apps/navidrome/navidrome/release/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
