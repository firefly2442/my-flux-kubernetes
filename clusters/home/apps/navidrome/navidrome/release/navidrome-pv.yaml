apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-music
  namespace: navidrome
spec:
  capacity:
    storage: 50Gi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-navidrome-music
  nfs:
    server: 192.168.1.114
    path: /data/windowsbackup/Music
    readOnly: true
  mountOptions:
    - ro
