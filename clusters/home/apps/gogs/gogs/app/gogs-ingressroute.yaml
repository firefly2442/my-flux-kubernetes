apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gogs-ingressroute
  namespace: gogs
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-clusterissuer
    gethomepage.dev/href: "https://gogs.homelab.rivetcode.com"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Gogs
    gethomepage.dev/group: Kubernetes
    gethomepage.dev/icon: gogs.png
    gethomepage.dev/app: gogs # optional, may be needed if app.kubernetes.io/name != ingress metadata.name
    gethomepage.dev/name: Gogs
    gethomepage.dev/widget.type: "gogs"
    # use .local domain name so we don't get blocked by authentik
    gethomepage.dev/widget.url: "http://gogs.gogs.svc.cluster.local"
    gethomepage.dev/pod-selector: ""
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`gogs.homelab.rivetcode.com`)
    kind: Rule
    services:
    - name: gogs
      port: 80
    middlewares:
      - name: authentik-service-middleware
        namespace: authentik
  tls:
    secretName: gogs-certificate-secret
