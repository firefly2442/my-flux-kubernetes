apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gogs-data
  namespace: gogs
spec:
  accessModes:
    - ReadWriteOnce
  storageClass: "longhorn-ha-2"
  resources:
    requests:
      storage: 1Gi
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/backup: enabled
