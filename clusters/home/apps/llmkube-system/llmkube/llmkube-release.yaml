apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
  namespace: llmkube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: llmkube
      # https://defilantech.github.io/LLMKube/index.yaml
      version: '0.10.7'
      sourceRef:
        kind: HelmRepository
        name: llmkube
        namespace: flux-system
      interval: 5m
  # https://github.com/defilantech/LLMKube/blob/main/charts/llmkube/values.yaml
  values:
    modelCache:
      # we use NFS to share and mount our local drive where we store the models
      # for the AMD Strix Halo and other machines to use if desired
      enabled: true
      mode: shared
      size: 300Gi
      storageClass: nfs-llmkube-models
      accessMode: ReadWriteMany
    extraObjects:
      - apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: nfs-llmkube-models
        # see kube-system/csi-driver-nfs for the driver setup
        provisioner: nfs.csi.k8s.io
        parameters:
          server: 192.168.1.120
          share: /models
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        mountOptions:
          - nfsvers=4.1
          - hard
          - noatime
