apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
  namespace: llmkube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: llmkube
      # https://defilantech.github.io/LLMKube/index.yaml
      version: '0.10.4'
      sourceRef:
        kind: HelmRepository
        name: llmkube
        namespace: flux-system
      interval: 5m
  # https://github.com/defilantech/LLMKube/blob/main/charts/llmkube/values.yaml
  values:
    modelCache:
      # we're going to use our own external model cache via s3
      enabled: false
