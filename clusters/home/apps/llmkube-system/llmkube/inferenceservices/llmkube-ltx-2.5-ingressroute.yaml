apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: llmkube-ltx-2.5-ingressroute
  namespace: llmkube-system
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-clusterissuer
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`ltx-2-5.homelab.rivetcode.com`)
    kind: Rule
    services:
    # services cannot have dots in the name
    - name: ltx-2-5-strix
      port: 8080
  tls:
    secretName: llmkube-ltx-2.5-certificate-secret
