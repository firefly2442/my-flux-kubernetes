apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: llmkube-qwen-image-2.1-ingressroute
  namespace: llmkube-system
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-clusterissuer
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`qwen-image-2-1.homelab.rivetcode.com`)
    kind: Rule
    services:
    # services cannot have dots in the name
    - name: qwen-image-2-1-strix
      port: 8080
  tls:
    secretName: llmkube-qwen-image-2.1-certificate-secret
