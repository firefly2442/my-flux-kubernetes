apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llmkube-configs
  namespace: llmkube-system
spec:
  interval: 5m
  path: ./clusters/home/apps/llmkube-system/llmkube/configs/
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
