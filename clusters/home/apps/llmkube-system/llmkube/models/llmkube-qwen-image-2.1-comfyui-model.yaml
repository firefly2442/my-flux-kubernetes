apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  # name must be all lowercase
  name: qwen-image-2.1-comfyui
  namespace: llmkube-system
spec:
  # https://huggingface.co/Comfy-Org/Qwen-Image-2.1
  source: hf://Comfy-Org/Qwen-Image-2.1
  files:
    - README.md
    - "diffusion_models/qwen_image_2.1_bf16.safetensors"
    - "diffusion_models/qwen_image_2.1_int8_convrot.safetensors"
    - "text_encoders/qwen3.5_9b_qwen_image_2.1_pe_i2i.int8_convrot.safetensors"
    - "text_encoders/qwen3.5_9b_qwen_image_2.1_pe_t2i.int8_convrot.safetensors"
    - "text_encoders/qwen3vl_8b_bf16.safetensors"
    - "vae/qwen_image_2.1_vae_bf16.safetensors"
  format: safetensors
  sourceSecretRef:
    name: llmkube-hf-read-token-secret
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: rocm
