apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  # name must be all lowercase
  name: qwen-image-2.1
  namespace: llmkube-system
spec:
  # https://huggingface.co/Qwen/Qwen-Image-2.1
  source: Qwen/Qwen-Image-2.1
  format: safetensors
  sourceSecretRef:
    name: llmkube-hf-read-token-secret
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: rocm
