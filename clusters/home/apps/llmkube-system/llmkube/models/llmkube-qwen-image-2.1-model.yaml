apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  # name must be all lowercase
  name: qwen-image-2.1
  namespace: llmkube-system
spec:
  # https://huggingface.co/Qwen/Qwen-Image-2.1
  source: hf://Qwen/Qwen-Image-2.1/
  files:
    - model_index.json
    - "processor/*.json"
    - "processor/*.jinja"
    - "scheduler/*.json"
    - "text_encoder/*.json"
    - "text_encoder/*.safetensors"
    - "transformer/*.json"
    - "transformer/*.safetensors"
    - "vae/*.json"
    - "vae/*.safetensors"
  format: safetensors
  sourceSecretRef:
    name: llmkube-hf-read-token-secret
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: rocm
