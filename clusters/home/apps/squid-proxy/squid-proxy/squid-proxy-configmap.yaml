apiVersion: v1
kind: ConfigMap
metadata:
  name: squid-proxy-config
  namespace: squid-proxy
data:
  squid.conf: |
    # Define standard ports
    acl SSL_ports port 443
    acl CONNECT method CONNECT

    # Deny anything that isn't trying to connect over SSL/HTTPS
    http_access deny !SSL_ports
    http_access deny !CONNECT

    # Define the allowed domain whitelist (adjust patterns as needed)
    acl allowed_domains dstdomain pypi.org
    acl allowed_domains dstdomain .pythonhosted.org
    acl allowed_domains dstdomain github.com
    acl allowed_domains dstdomain .githubusercontent.com

    # Allow matches to the whitelist, deny everything else
    http_access allow allowed_domains
    http_access deny all

    # Run proxy on standard port 3128
    http_port 3128

    # Performance tuning for high-concurrency tools like uv
    coredump_dir /var/spool/squid
    access_log stdio:/dev/stdout
