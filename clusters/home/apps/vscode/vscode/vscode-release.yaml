apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vscode
  namespace: vscode
spec:
  interval: 5m
  chart:
    spec:
      chart: ./chart
      sourceRef:
        kind: GitRepository
        name: vscode
        namespace: flux-system
  # https://github.com/firefly2442/docker-vscode-customized/blob/master/chart/values.yaml
  values:
    image:
      repository: harbor.homelab.rivetcode.com/ghcr-proxy/firefly2442/docker-vscode-customized
    env:
      - name: OPENCODE_CONFIG
        value: /etc/opencode/opencode.json
    volumeMounts:
      - name: opencode-config
        mountPath: /etc/opencode
        readOnly: true
    volumes:
      - name: opencode-config
        configMap:
          name: opencode-config
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: false
