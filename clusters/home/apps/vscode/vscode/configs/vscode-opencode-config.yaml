apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
  namespace: vscode
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "autoupdate": false,
      "share": "disabled",
      "permission": {
        "read": "allow",
        "edit": "allow",
        "glob": "allow",
        "grep": "allow",
        "bash": "allow",
        "websearch": "deny",
        "webfetch": "deny"
      },
      "provider": {
        "qwen3-8": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "qwen3-8",
          "options": {
            "baseURL": "http://qwen3-8-27b-uncensored-strix.llmkube-system.svc.cluster.local:8080/v1"
          },
          "models": {
            "qwen3.8-27b-uncensored": { "name": "qwen3.8-27b-uncensored" }
          }
        },
        "gemma-4": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "gemma-4",
          "options": {
            "baseURL": "http://gemma-4-26b-strix.llmkube-system.svc.cluster.local:8080/v1"
          },
          "models": {
            "gemma-4": { "name": "gemma-4" }
          }
        }
      },
      "model": "gemma-4/gemma-4"
    }
