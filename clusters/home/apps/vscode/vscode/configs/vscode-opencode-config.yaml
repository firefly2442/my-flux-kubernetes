apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
  namespace: vscode
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "autoupdate": false,
      "share": "disabled",
      "permission": {
        "read": "allow",
        "edit": "allow",
        "glob": "allow",
        "grep": "allow",
        "bash": "allow",
        "websearch": "deny",
        "webfetch": "deny"
      },
      "provider": {
        "strix": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "strix",
          "options": {
            "baseURL": "http://qwen3-8-27b-uncensored-strix.llmkube-system.svc.cluster.local:8080/v1"
          },
          "models": {
            "qwen3.8-27b-uncensored": { "name": "qwen3.8-27b-uncensored" }
          }
        }
      },
      "model": "strix/qwen3.8-27b-uncensored"
    }
