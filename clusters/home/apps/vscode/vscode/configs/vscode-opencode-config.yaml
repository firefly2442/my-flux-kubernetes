apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
  namespace: vscode
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "autoupdate": false,
      "share": "disabled",
      "permission": {
        "edit": "allow",
        "bash": "ask",
        "webfetch": "deny"
      },
      "provider": {
        "internal-llm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Internal Gateway",
          "options": {
            "baseURL": "http://litellm.litellm.svc.cluster.local:4000/v1"
          },
          "models": {
            "my-model": { "name": "My Model" }
          }
        }
      },
      "model": "internal-llm/my-model"
    }
