apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vscode-lockdown
  namespace: vscode
spec:
  podSelector: {} # all pods in this namespace
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system # the controller namespace
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus # Gatus namespace
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gatus
      ports:
        - port: 8443
  egress: # very limited, some internet through proxy, only access to local models
    # DNS, only to cluster CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The model service in llmkube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llmkube-system
      ports:
        - port: 8080
          protocol: TCP
    # Allow egress traffic to the internal proxy pod
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: squid-proxy
      ports:
        - port: 3128
          protocol: TCP
