apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: birdnet-go-config
  namespace: birdnet-go
spec:
  interval: 5m
  path: ./clusters/home/apps/birdnet-go/birdnet-go/configs/
  prune: true # remove any elements later removed from the above path
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
