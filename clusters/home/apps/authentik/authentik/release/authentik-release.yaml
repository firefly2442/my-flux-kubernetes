apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 5m
  chart:
    spec:
      chart: authentik
      # https://charts.goauthentik.io/index.yaml
      version: '2026.8.5'
      sourceRef:
        kind: HelmRepository
        name: authentik-repo
        namespace: flux-system
      interval: 5m
  # https://github.com/goauthentik/helm/blob/main/charts/authentik/values.yaml
  values:
    server:
      metrics:
        enabled: true
    authentik:
      secret_key: "secret"
      # This sends anonymous usage-data, stack traces on errors and
      # performance data to sentry.io, and is fully opt-in
      error_reporting:
        enabled: false
      postgresql:
        password: "secret"
    postgresql:
      enabled: true
      auth:
        password: "secret"
    redis:
      enabled: true
    global:
      env:
        # try to prevent issues with authentik postgres failing via
        # Failed process was running: FETCH FORWARD 100 FROM "_django_curs_136480365278912_sync_14055"
        - name: AUTHENTIK_POSTGRESQL__DISABLE_SERVER_SIDE_CURSORS
          value: "true"
      envFrom:
        - secretRef:
            name: authentik-akadmin-credentials
