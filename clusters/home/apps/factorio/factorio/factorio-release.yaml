apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: factorio
  namespace: factorio
spec:
  interval: 5m
  chart:
    spec:
      chart: factorio
      version: 11.10.2
      sourceRef:
        kind: HelmRepository
        name: factorio
        namespace: flux-system
      interval: 5m
  # https://github.com/trueforge-org/truecharts/blob/master/charts/stable/factorio/values.yaml
  values:
    image:
      repository: harbor.homelab.rivetcode.com/dockerhub-proxy/factoriotools/factorio
    persistence:
      config:
        enabled: true
        mountPath: /factorio
        size: 2Gi
        storageClass: "longhorn-ha-2"
    service:
      type: LoadBalancer
